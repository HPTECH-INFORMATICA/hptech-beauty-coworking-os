            type: string
            format: date-time
      responses:
        "200":
          description: Agenda da unidade
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgendaEntry"

  /api/v1/professional/me/bookings:
    get:
      tags:
        - Professional Portal
      summary: Listar minhas reservas
      operationId: listMyBookings
      description: |
        O professional_id é derivado da identidade autenticada.
        O cliente não pode selecionar outro profissional.
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      responses:
        "200":
          description: Reservas do profissional autenticado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/professional/me/invoices:
    get:
      tags:
        - Professional Portal
      summary: Listar minhas faturas
      operationId: listMyInvoices
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      responses:
