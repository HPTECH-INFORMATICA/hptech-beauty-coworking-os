              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token de identidade autenticada. Autorização, tenant membership,
        role e escopo são validados server-side.

  parameters:
    TenantHeader:
      name: X-Tenant-Id
      in: header
      required: true
      description: |
        Tenant operacional selecionado. O servidor deve validar se a
        identidade autenticada possui membership ativa neste tenant.
        O valor nunca deve ser confiado apenas por ter sido enviado pelo cliente.
      schema:
        type: string
        format: uuid

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255

    TenantPathId:
      name: tenant_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    UnitPathId:
      name: unit_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ProfessionalPathId:
      name: professional_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ResourcePathId:
      name: resource_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    BookingPathId:
      name: booking_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    SeriesPathId:
      name: series_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    UsagePathId:
      name: usage_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    InvoicePathId:
      name: invoice_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PaymentPathId:
      name: payment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Autenticação ausente ou inválida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: Identidade sem permissão para a operação
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Recurso não encontrado no tenant acessível
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: Conflito de estado, concorrência, overlap ou idempotência
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ValidationError:
      description: Dados semanticamente inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: bcos-api

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type:
            - string
            - "null"
        details:
          type:
            - object
            - "null"
          additionalProperties: true

    Money:
      type: string
      pattern: '^-?\d{1,10}\.\d{2}$'
      examples:
        - "150.00"

    TenantStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE

    MembershipRole:
      type: string
      enum:
        - OWNER
        - ADMIN
        - RECEPTION
        - PROFESSIONAL

    MembershipStatus:
      type: string
      enum:
        - INVITED
        - ACTIVE
        - INACTIVE

    ProfessionalStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE

    ResourceOperationalStatus:
      type: string
      description: |
        Estado operacional cadastral do recurso. A disponibilidade temporal
        efetiva é determinada pelo mecanismo interno ResourceOccupancy.
      enum:
        - AVAILABLE
        - OCCUPIED
        - CLEANING
        - MAINTENANCE
        - BLOCKED

    BookingStatus:
      type: string
      enum:
        - PENDING
        - CONFIRMED
        - COMPLETED
        - CANCELLED
        - NO_SHOW

    UsageStatus:
      type: string
      enum:
        - PENDING
        - CHECKED_IN
        - COMPLETED
        - CANCELLED

    PricingRuleStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE

    InvoiceStatus:
      type: string
      enum:
        - OPEN
        - PARTIALLY_PAID
        - PAID
        - CANCELLED

    InvoiceItemType:
      type: string
      enum:
        - BASE_LEASE
        - OVERTIME
        - ADJUSTMENT
        - DISCOUNT

    PaymentStatus:
      type: string
      enum:
        - PENDING
        - CONFIRMED
        - CANCELLED
        - FAILED

    PaymentMethod:
      type: string
      enum:
        - PIX
        - CASH
        - CARD
        - OTHER

    Tenant:
      type: object
      required:
        - id
        - name
        - slug
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          $ref: "#/components/schemas/TenantStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Unit:
      type: object
      required:
        - id
        - name
        - timezone
        - active
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        timezone:
          type: string
          description: Timezone IANA, por exemplo America/Sao_Paulo.
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UnitCreate:
      type: object
      additionalProperties: false
      required:
        - name
        - timezone
      properties:
        name:
          type: string
          minLength: 1
        timezone:
          type: string
          minLength: 1
        active:
          type: boolean
          default: true

    UnitUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        timezone:
          type: string
          minLength: 1
        active:
          type: boolean

    ReceptionHours:
      type: object
      required:
        - day_of_week
        - is_closed
      properties:
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
        opens_at:
          type:
            - string
            - "null"
          format: time
        closes_at:
          type:
            - string
            - "null"
          format: time
        is_closed:
          type: boolean

    ReceptionHoursInput:
      allOf:
        - $ref: "#/components/schemas/ReceptionHours"

    Membership:
      type: object
      required:
        - id
        - external_user_id
        - role
        - status
      properties:
        id:
          type: string
          format: uuid
        external_user_id:
          type: string
        role:
          $ref: "#/components/schemas/MembershipRole"
        status:
          $ref: "#/components/schemas/MembershipStatus"

    MembershipCreate:
      type: object
      additionalProperties: false
      required:
        - external_user_id
        - role
      properties:
        external_user_id:
          type: string
          minLength: 1
        role:
          $ref: "#/components/schemas/MembershipRole"

    Professional:
      type: object
      required:
        - id
        - name
        - status
      properties:
        id:
          type: string
          format: uuid
        external_user_id:
          type:
            - string
            - "null"
        name:
          type: string
        email:
          type:
            - string
            - "null"
          format: email
        phone:
          type:
            - string
            - "null"
        status:
          $ref: "#/components/schemas/ProfessionalStatus"

    ProfessionalCreate:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        external_user_id:
          type:
            - string
            - "null"
        name:
          type: string
          minLength: 1
        email:
          type:
            - string
            - "null"
          format: email
        phone:
          type:
            - string
            - "null"

    ProfessionalUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        external_user_id:
          type:
            - string
            - "null"
        name:
          type: string
          minLength: 1
        email:
          type:
            - string
            - "null"
          format: email
        phone:
          type:
            - string
            - "null"
        status:
          $ref: "#/components/schemas/ProfessionalStatus"

    ResourceCategory:
      type: object
      required:
        - id
        - name
        - active
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        active:
          type: boolean

    ResourceCategoryCreate:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        active:
          type: boolean
          default: true

    Resource:
      type: object
      required:
        - id
        - unit_id
        - category_id
        - name
        - operational_status
        - buffer_before_minutes
        - buffer_after_minutes
        - active
      properties:
        id:
          type: string
          format: uuid
        unit_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        name:
          type: string
        operational_status:
          $ref: "#/components/schemas/ResourceOperationalStatus"
        buffer_before_minutes:
          type: integer
          minimum: 0
        buffer_after_minutes:
          type: integer
          minimum: 0
        active:
          type: boolean

    ResourceCreate:
      type: object
