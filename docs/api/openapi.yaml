      required:
        - unit_id
        - category_id
        - name
      properties:
        unit_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        buffer_before_minutes:
          type: integer
          minimum: 0
          default: 0
        buffer_after_minutes:
          type: integer
          minimum: 0
          default: 0
        active:
          type: boolean
          default: true

    ResourceUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        operational_status:
          $ref: "#/components/schemas/ResourceOperationalStatus"
        buffer_before_minutes:
          type: integer
          minimum: 0
        buffer_after_minutes:
          type: integer
          minimum: 0
        active:
          type: boolean

    AvailabilityItem:
      type: object
      required:
        - resource_id
        - available
      properties:
        resource_id:
          type: string
          format: uuid
        available:
          type: boolean
        reason:
          type:
            - string
            - "null"

    AvailabilityResponse:
      type: object
      required:
        - starts_at
        - ends_at
        - resources
      properties:
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        resources:
