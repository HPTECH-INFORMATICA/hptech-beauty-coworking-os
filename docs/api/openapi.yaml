          type: string
          format: uuid
        unit_id:
          type: string
          format: uuid
        resource_id:
          type: string
          format: uuid
        professional_id:
          type: string
          format: uuid
        series_id:
          type:
            - string
            - "null"
          format: uuid
        status:
          $ref: "#/components/schemas/BookingStatus"
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        buffer_before_minutes:
          type: integer
          minimum: 0
        buffer_after_minutes:
          type: integer
          minimum: 0
        pricing_snapshot:
          type: object
          additionalProperties: true
        notes:
          type:
            - string
            - "null"
        confirmed_at:
          type:
            - string
            - "null"
          format: date-time
        cancelled_at:
          type:
            - string
            - "null"
          format: date-time
        completed_at:
          type:
            - string
            - "null"
          format: date-time

    BookingCreate:
