openapi: 3.1.0

info:
  title: HPTECH Beauty Coworking OS API
  version: 1.0.0
  description: |
    Contrato oficial da API V1 do HPTECH Beauty Coworking OS.

    SaaS B2B multi-tenant para gestão operacional e financeira de
    coworkings de beleza, estética, saúde e bem-estar.

    Princípios arquiteturais:
      - isolamento rigoroso entre tenants;
      - tenant context validado server-side;
      - ResourceOccupancy como fonte canônica de indisponibilidade física;
      - Booking e Usage como domínios distintos;
      - Pricing, Billing e Payment como domínios distintos;
      - pricing snapshot imutável no Booking;
      - operações financeiras idempotentes;
      - Transactional Outbox para eventos financeiros críticos;
      - RBAC e autorização exclusivamente server-side;
      - Professional operando sob escopo own;
      - valores monetários representados como decimal, nunca float;
      - timestamps persistidos em UTC e interpretados pela timezone IANA da Unit.

    ResourceOccupancy e Outbox são mecanismos internos de infraestrutura
    e não são expostos como CRUD público.

servers:
  - url: /
    description: HPTECH Beauty Coworking OS API

tags:
  - name: System
  - name: Tenants
  - name: Units
  - name: Memberships
  - name: Professionals
  - name: Resource Categories
  - name: Resources
  - name: Availability
  - name: Bookings
  - name: Usage
  - name: Pricing
  - name: Invoices
  - name: Payments
  - name: Reception
  - name: Professional Portal
  - name: Owner
  - name: Audit

paths:
  /health:
    get:
      tags:
        - System
      summary: Health check
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Serviço operacional
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/tenants:
    get:
      tags:
        - Tenants
      summary: Listar tenants acessíveis ao usuário autenticado
      operationId: listTenants
      responses:
        "200":
          description: Tenants acessíveis
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tenant"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/tenants/{tenant_id}:
    get:
      tags:
        - Tenants
      summary: Obter tenant
      operationId: getTenant
      parameters:
        - $ref: "#/components/parameters/TenantPathId"
      responses:
        "200":
          description: Tenant encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/units:
    get:
      tags:
        - Units
      summary: Listar unidades do tenant
      operationId: listUnits
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      responses:
        "200":
          description: Lista de unidades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Unit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags:
        - Units
      summary: Criar unidade
      operationId: createUnit
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitCreate"
      responses:
        "201":
          description: Unidade criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/units/{unit_id}:
    get:
      tags:
        - Units
      summary: Obter unidade
      operationId: getUnit
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/UnitPathId"
      responses:
        "200":
          description: Unidade encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags:
        - Units
      summary: Atualizar unidade
      operationId: updateUnit
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/UnitPathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitUpdate"
      responses:
        "200":
          description: Unidade atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/units/{unit_id}/reception-hours:
    get:
      tags:
        - Units
      summary: Consultar horários da recepção
      operationId: getReceptionHours
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/UnitPathId"
      responses:
        "200":
          description: Horários da recepção
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReceptionHours"

    put:
      tags:
        - Units
      summary: Definir horários da recepção
      operationId: replaceReceptionHours
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/UnitPathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 7
              items:
                $ref: "#/components/schemas/ReceptionHoursInput"
      responses:
        "200":
          description: Horários atualizados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReceptionHours"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/memberships:
    get:
      tags:
        - Memberships
      summary: Listar membros do tenant
      operationId: listMemberships
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      responses:
        "200":
          description: Lista de memberships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Membership"

    post:
      tags:
        - Memberships
      summary: Criar ou convidar membro
      operationId: createMembership
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipCreate"
      responses:
        "201":
          description: Membership criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/professionals:
    get:
      tags:
        - Professionals
      summary: Listar profissionais
      operationId: listProfessionals
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      responses:
        "200":
          description: Lista de profissionais
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Professional"

    post:
      tags:
        - Professionals
      summary: Criar profissional
      operationId: createProfessional
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfessionalCreate"
      responses:
        "201":
          description: Profissional criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Professional"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/professionals/{professional_id}:
    get:
      tags:
        - Professionals
      summary: Obter profissional
      operationId: getProfessional
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/ProfessionalPathId"
      responses:
        "200":
          description: Profissional encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Professional"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags:
        - Professionals
      summary: Atualizar profissional
      operationId: updateProfessional
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/ProfessionalPathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfessionalUpdate"
      responses:
        "200":
          description: Profissional atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Professional"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/resource-categories:
    get:
      tags:
        - Resource Categories
      summary: Listar categorias de recursos
      operationId: listResourceCategories
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      responses:
        "200":
          description: Categorias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResourceCategory"

    post:
      tags:
        - Resource Categories
      summary: Criar categoria de recurso
      operationId: createResourceCategory
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceCategoryCreate"
      responses:
        "201":
          description: Categoria criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceCategory"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/resources:
    get:
      tags:
        - Resources
      summary: Listar recursos
      operationId: listResources
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: unit_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: category_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recursos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"

    post:
      tags:
        - Resources
      summary: Criar recurso
      operationId: createResource
      description: |
        A unidade e a categoria informadas devem pertencer ao mesmo tenant
        selecionado em X-Tenant-Id.
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceCreate"
      responses:
        "201":
          description: Recurso criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/resources/{resource_id}:
    get:
      tags:
        - Resources
      summary: Obter recurso
      operationId: getResource
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/ResourcePathId"
      responses:
        "200":
          description: Recurso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags:
        - Resources
      summary: Atualizar recurso
      operationId: updateResource
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/ResourcePathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceUpdate"
      responses:
        "200":
          description: Recurso atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/availability:
    get:
      tags:
        - Availability
      summary: Consultar disponibilidade
      operationId: getAvailability
      description: |
        Consulta preventiva para UX.

        A resposta desta operação não reserva o recurso e não substitui a
        validação transacional no momento da confirmação de uma reserva.
        A criação final de ResourceOccupancy no PostgreSQL é a autoridade
        definitiva contra concorrência e overlap.
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: unit_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: starts_at
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: ends_at
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: resource_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: category_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Disponibilidade calculada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/bookings:
    get:
      tags:
        - Bookings
      summary: Listar reservas
      operationId: listBookings
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: starts_from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: starts_until
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: professional_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: resource_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/BookingStatus"
      responses:
        "200":
          description: Reservas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"

    post:
      tags:
        - Bookings
      summary: Criar reserva
      operationId: createBooking
      description: |
        Cria uma reserva inicialmente em PENDING.

        PENDING não representa bloqueio físico definitivo do recurso.
        A confirmação é uma operação separada e transacional.

        unit_id e resource_id devem apontar para uma combinação válida
        dentro do mesmo tenant. Essa consistência deve ser validada pela
        camada de aplicação.

        pricing_snapshot é capturado no momento da criação e torna-se
        histórico imutável da reserva.
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingCreate"
      responses:
        "201":
          description: Reserva criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/bookings/{booking_id}:
    get:
      tags:
        - Bookings
      summary: Obter reserva
      operationId: getBooking
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/BookingPathId"
      responses:
        "200":
          description: Reserva encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/bookings/{booking_id}/confirm:
    post:
      tags:
        - Bookings
      summary: Confirmar reserva
      operationId: confirmBooking
      description: |
        Confirma a reserva e tenta adquirir a ocupação física do recurso.

        A operação deve ocorrer atomicamente. O INSERT final da
        ResourceOccupancy ACTIVE e sua constraint EXCLUDE no PostgreSQL
        são a autoridade contra double booking.

        Em conflito de concorrência ou overlap, a confirmação falha
        integralmente com HTTP 409.
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/BookingPathId"
      responses:
        "200":
          description: Reserva confirmada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/bookings/{booking_id}/cancel:
    post:
      tags:
        - Bookings
      summary: Cancelar reserva
      operationId: cancelBooking
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/BookingPathId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingCancelRequest"
      responses:
        "200":
          description: Reserva cancelada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/bookings/{booking_id}/extend:
    post:
      tags:
        - Bookings
      summary: Estender reserva
      operationId: extendBooking
      description: |
        A extensão deve revalidar a disponibilidade e atualizar a ocupação
        física de forma transacional.

        Se o novo intervalo entrar em conflito com outra ocupação ACTIVE,
        nenhuma alteração parcial deve persistir.
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/BookingPathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingExtendRequest"
      responses:
        "200":
          description: Reserva estendida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/booking-series:
    post:
      tags:
        - Bookings
      summary: Criar série recorrente
      operationId: createBookingSeries
      description: |
        A recorrência utiliza RRULE.

        No V1, todas as ocorrências devem passar por dry-run antes da
        persistência. Se qualquer ocorrência apresentar conflito,
        toda a série é rejeitada e nenhuma ocorrência é criada.
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingSeriesCreate"
      responses:
        "201":
          description: Série criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingSeriesResult"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/booking-series/{series_id}/cancel:
    post:
      tags:
        - Bookings
      summary: Cancelar ocorrências futuras de uma série
      operationId: cancelBookingSeries
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/SeriesPathId"
      responses:
        "200":
          description: Série cancelada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingSeries"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/usages/check-in:
    post:
      tags:
        - Usage
      summary: Realizar check-in
      operationId: checkIn
      description: |
        Cria ou inicia o Usage correspondente à reserva confirmada.
        Booking e Usage permanecem entidades distintas.
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInRequest"
      responses:
        "201":
          description: Check-in realizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usage"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/usages/{usage_id}/check-out:
    post:
      tags:
        - Usage
      summary: Realizar check-out
      operationId: checkOut
      description: |
        Finaliza o Usage.

        A mesma transação de banco deve registrar o evento
        USAGE_COMPLETED na Transactional Outbox.

        O worker processará posteriormente Pricing/Billing de forma
        idempotente.

        Excedente ocorrido após o encerramento da recepção não deve gerar
        cobrança de overtime conforme a regra V1 do produto.
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/UsagePathId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckOutRequest"
      responses:
        "200":
          description: Check-out concluído
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usage"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/pricing-rules:
    get:
      tags:
        - Pricing
      summary: Listar regras de preço
      operationId: listPricingRules
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      responses:
        "200":
          description: Regras de preço
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PricingRule"

    post:
      tags:
        - Pricing
      summary: Criar regra de preço
      operationId: createPricingRule
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingRuleCreate"
      responses:
        "201":
          description: Regra criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingRule"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/invoices:
    get:
      tags:
        - Invoices
      summary: Listar faturas
      operationId: listInvoices
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: professional_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/InvoiceStatus"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Faturas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"

  /api/v1/invoices/{invoice_id}:
    get:
      tags:
        - Invoices
      summary: Obter fatura
      operationId: getInvoice
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/InvoicePathId"
      responses:
        "200":
          description: Fatura
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceDetail"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/invoices/{invoice_id}/close:
    post:
      tags:
        - Invoices
      summary: Fechar fatura manual acumulada
      operationId: closeManualInvoice
      description: |
        Registra o fechamento explícito de uma Invoice acumulada MANUAL.

        A operação exige contexto autenticado do tenant e permissão
        OPERATIONS. O fechamento materializa manual_closed_at e não liquida
        o saldo, não altera o status financeiro e não cria pagamento.

        Apenas Invoices MANUAL elegíveis podem ser fechadas. Repetições
        idempotentes preservam o instante original de fechamento.
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/InvoicePathId"
      responses:
        "200":
          description: Fatura manual fechada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/payments:
    post:
      tags:
        - Payments
      summary: Registrar pagamento
      operationId: createPayment
      description: |
        Registro manual de pagamento no V1, com foco principal em PIX.

        Idempotency-Key é obrigatório. Repetir a mesma chave no mesmo
        tenant não pode produzir pagamento duplicado.
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentCreate"
      responses:
        "201":
          description: Pagamento registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/payments/{payment_id}/confirm:
    post:
      tags:
        - Payments
      summary: Confirmar pagamento
      operationId: confirmPayment
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/PaymentPathId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentConfirmRequest"
      responses:
        "200":
          description: Pagamento confirmado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/reception/now:
