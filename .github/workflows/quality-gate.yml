name: BCOS Quality Gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: bcos-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web
        run: pnpm --filter @hptech/bcos-web lint

      - name: Typecheck web
        run: pnpm --filter @hptech/bcos-web typecheck

      - name: Test web
        run: pnpm --filter @hptech/bcos-web test

      - name: Build web
        run: pnpm --filter @hptech/bcos-web build

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install API with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "types-python-dateutil>=2.9.0.20260807"

      - name: Ruff API
        run: python -m ruff check src tests

      - name: Mypy API
        run: python -m mypy src

      - name: Test API
        run: python -m pytest tests -q

      - name: Alembic single-head gate
        shell: bash
        run: |
          test "$(python -m alembic heads | grep -c '(head)')" -eq 1
          python -m alembic heads

  worker:
    name: Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/worker/pyproject.toml

      - name: Install worker with dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff worker
        run: python -m ruff check src tests

      - name: Mypy worker
        run: python -m mypy src

      - name: Test worker
        run: python -m pytest tests -q
