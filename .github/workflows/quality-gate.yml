name: BCOS Quality Gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: bcos-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.[jt]s', 'apps/web/**/*.[jt]sx', 'apps/web/**/*.mjs', 'apps/web/**/*.css') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      - name: Refresh lockfile for dependency changes
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web
        working-directory: apps/web
        run: pnpm exec eslint . --max-warnings=0

      - name: Typecheck web
        run: pnpm --filter @hptech/bcos-web typecheck

      - name: Test web
        run: pnpm --filter @hptech/bcos-web test

      - name: Build web
        run: pnpm --filter @hptech/bcos-web build

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install API with dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff API
        run: python -m ruff check src tests

      - name: Mypy API
        run: python -m mypy src

      - name: Test API
        run: python -m pytest tests -q

      - name: Alembic single-head gate
        shell: bash
        run: |
          test "$(python -m alembic heads | grep -c '(head)')" -eq 1
          python -m alembic heads

      - name: Alembic full-chain SQL compilation
        shell: bash
        env:
          DATABASE_URL: postgresql+psycopg://bcos_ci:bcos_ci@localhost/bcos_ci
        run: |
          python -m alembic upgrade head --sql > /tmp/bcos-schema.sql
          test -s /tmp/bcos-schema.sql
          grep -q "0007_invoice_cycle_identity" /tmp/bcos-schema.sql
          grep -q "professional_billing_contract_id" /tmp/bcos-schema.sql
          grep -q "billing_cycle_start" /tmp/bcos-schema.sql
          grep -q "billing_cycle_end" /tmp/bcos-schema.sql
          grep -q "manual_closed_at" /tmp/bcos-schema.sql

  worker:
    name: Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/worker/pyproject.toml

      - name: Install worker with dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff worker
        run: python -m ruff check src tests

      - name: Mypy worker
        run: python -m mypy src

      - name: Test worker
        run: python -m pytest tests -q
