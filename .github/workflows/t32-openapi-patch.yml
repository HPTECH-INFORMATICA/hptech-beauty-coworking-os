name: T32 OpenAPI Patch

on:
  push:
    branches:
      - bcos-m7-a3-t32-openapi-pagination-implementation

permissions:
  contents: write

jobs:
  patch-openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bcos-m7-a3-t32-openapi-pagination-implementation
      - name: Patch invoice pagination parameters
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/api/openapi.yaml')
          text = path.read_text(encoding='utf-8')
          old = '''        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/InvoiceStatus"
      responses:
'''
          new = '''        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/InvoiceStatus"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one target block, found {count}')
          updated = text.replace(old, new, 1)
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit exact T32 patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api/openapi.yaml
          git diff --cached --check
          git commit -m "BCOS-M7: reconcile invoice pagination in static OpenAPI"
          git push origin HEAD:bcos-m7-a3-t32-openapi-pagination-implementation
