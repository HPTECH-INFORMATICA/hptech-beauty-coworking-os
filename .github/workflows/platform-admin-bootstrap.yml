name: BCOS Platform Admin Bootstrap

on:
  workflow_dispatch:
    inputs:
      external_user_id:
        description: "Trusted external identity for the first HPTECH PLATFORM_ADMIN"
        required: true
        type: string
      confirmation:
        description: "Type BOOTSTRAP_BCOS_PLATFORM_ADMIN"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bcos-platform-admin-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: ${{ inputs.confirmation == 'BOOTSTRAP_BCOS_PLATFORM_ADMIN' }}
    runs-on: ubuntu-latest
    environment: bcos-production
    defaults:
      run:
        working-directory: services/api
    env:
      DATABASE_URL: ${{ secrets.BCOS_PRODUCTION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: python -m pip install .
      - name: Require production database secret
        run: test -n "$DATABASE_URL"
      - name: Bootstrap first platform administrator
        run: >-
          python -m bcos_api.platform.bootstrap
          --external-user-id "${{ inputs.external_user_id }}"
          --confirmation "${{ inputs.confirmation }}"
