[project]
name = "hptech-beauty-coworking-worker"
version = "0.0.0"
description = "Background worker for HPTECH Beauty Coworking OS"
requires-python = ">=3.12,<3.13"
dependencies = [
    "SQLAlchemy==2.0.52",
    "psycopg[binary]==3.3.4",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.4",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[project.scripts]
bcos-worker = "bcos_worker.main:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
minversion = "9.1"
addopts = "-ra"
asyncio_mode = "strict"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bcos_worker"
